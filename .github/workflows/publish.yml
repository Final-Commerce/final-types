name: Publish (gated)

# Manual trigger only — no auto-publish during extraction phase.
# Run this after Render is fully migrated and the version in package.json
# has been bumped from 0.0.0-dev to a real semver.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # required for npm provenance via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@final-commerce"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format json --output-file sbom.json
      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish (real)
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
